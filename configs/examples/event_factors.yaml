ingest:
  aliases:
    instrument: code
    entry_intent_date: buy_date
    exit_intent_date: sell_date
    features:
      box_quality: box_quality
      pct_b: "%B"
      bandwidth_percent: bandwidth_percent
      pre_cum2: pre_cum2
      pre_r1: pre_r1
      rsi_value: rsi_value
  coalesce: last

signals:
  filters:
    - { field: features.box_quality, op: ge, value: 0.94 }
  rank_by:
    - { field: features.bandwidth_percent, ascending: true }

portfolio:
  starting_cash: 1000000
  sizing: equal_weight
  sizing_base: cash
  max_weight: 0.35
  max_new_entries_per_day: 10
  lot_size: 100

execution:
  price: open
  lag_sessions: 0
  order_validity_sessions: 5
  entry_filter:
    enabled: false
    ref: decision_prior_close

costs:
  commission_rate: 0.00008   # 万0.8
  commission_min: 0.0
  stamp_duty_rate: 0.0005    # 印花税万5（卖出）
  transfer_fee_rate: 0.00001 # 税费/过户费万0.1（买卖）
  slippage_bps: 10.0

risk:
  stop_loss: -0.086
  take_profit: 0.158
  max_hold_sessions: null

adjustment:
  mode: qfq

benchmark:
  instrument: "000852.SH"

hypothesis:
  id: example_event_factors
  statement: "Template only; replace with evidence-backed hypothesis before research conclusions."

gates:
  min_oos_folds: 2
  min_trades: 10
  n_trials_assumed: 1
  min_oos_sharpe: 0.0
  max_oos_drawdown: 0.35
  require_economic_for_promote: true
  # min_deflated_sharpe: 0.0
  # pit_strict: false

factors:
  min_non_null: 50
  max_features: 32
  n_quantiles: 5
  quantile_horizon: 5
  # Decoupled prep for factor diagnostics only (signals/backtest stay on raw features)
  preprocess:
    enabled: false
    steps: [winsorize, industry_neutral, size_neutral, zscore]
    winsorize_q: 0.01
    industry_field: features.industry
    size_field: features.total_mv
    cross_section: all   # or date
    min_group_size: 30
    suffix: __prep

ic_horizons: [1, 5, 10, 20]
