ingest:
  # limit10 | limit20 | all — limit20=科创688/689+创业300/301（约20%涨跌停）；默认 limit10
  board: limit10
  aliases:
    instrument: code
    entry_intent_date: buy_date
    exit_intent_date: sell_date
    # Mapped from plat_* / 平台箱体 CSV columns that have data.
    # Empty in current sample (omitted): outperform_index, stock_return,
    # volume_increase_ratio, turnover_avg_rate, turnover_max_rate, turnover_stability.
    features:
      name: name
      box_quality: box_quality
      pct_b: "%B"
      support_levels: support_levels
      resistance_levels: resistance_levels
      industry: industry
      weighted_score: weighted_score
      has_breakthrough: has_breakthrough
      has_breakthrough_confirmation: has_breakthrough_confirmation
      volume_has_consolidation: volume_has_consolidation
      volume_has_breakthrough: volume_has_breakthrough
      volume_change_ratio: volume_change_ratio
      volume_stability: volume_stability
      volume_trend: volume_trend
      turnover_meets_criteria: turnover_meets_criteria
      turnover_spike_count: turnover_spike_count
      macd_signal: macd_signal
      rsi_signal: rsi_signal
      kdj_signal: kdj_signal
      bollinger_signal: bollinger_signal
      macd_value: macd_value
      macd_signal_value: macd_signal_value
      macd_hist: macd_hist
      rsi_value: rsi_value
      k_value: k_value
      d_value: d_value
      j_value: j_value
      bb_upper: bb_upper
      bb_middle: bb_middle
      bb_lower: bb_lower
      bandwidth: bandwidth
      bandwidth_percent: bandwidth_percent
      pre_cum2: pre_cum2
      pre_r1: pre_r1
      turnover_rate_f_tw_avg: turnover_rate_f_tw_avg
      total_mv: total_mv
      circ_mv: circ_mv
      bb_mid_slope_6w: bb_mid_slope_6w
      bb_bandwidth_slope_5w: bb_bandwidth_slope_5w
      bb_mid_slope_10d: bb_mid_slope_10d
      bb_bandwidth_slope_8d: bb_bandwidth_slope_8d
  coalesce: last

# SIGNAL PLACEHOLDER — NOT a researched strategy.
# After copy: leave empty until factor-analysis.md fills filters/rank_by/composite
# from IC evidence. Do NOT keep any example filter/rank as "default alpha".
signals:
  filters: []
  rank_by: []

portfolio:
  starting_cash: 1000000
  sizing: equal_weight
  sizing_base: cash
  max_weight: 0.34
  max_new_entries_per_day: 10
  lot_size: 100
  # Industry diversification at pretrade (null = off). Set explicitly from research motive;
  # do not invent N/K without stating why in hypothesis.statement.
  # industry_field: features.industry
  # max_names_per_industry: null
  # max_new_per_industry_per_day: null

execution:
  price: open
  lag_sessions: 0
  order_validity_sessions: 5
  entry_filter:
    enabled: false
    ref: decision_prior_close

costs:
  commission_rate: 0.00008   # 万0.8
  commission_min: 0.0
  stamp_duty_rate: 0.0005    # 印花税万5（卖出）
  transfer_fee_rate: 0.00001 # 税费/过户费万0.1（买卖）
  slippage_bps: 10.0

risk:
  stop_loss: -0.086
  take_profit: 0.158
  max_hold_sessions: null

adjustment:
  mode: qfq

benchmark:
  instrument: "000852.SH"

hypothesis:
  id: example_event_factors
  statement: >-
    TEMPLATE ONLY (ingest/costs/risk scaffolding). signals.filters/rank_by are
    intentionally empty — must be written from factor compare evidence into a
    new configs/experiments/*.yaml. Copying this file with blank or invented
    signals is NOT a factor-driven strategy.
  expected_sign: {}

gates:
  min_oos_folds: 2
  min_trades: 10
  n_trials_assumed: 1
  min_oos_sharpe: 0.0
  max_oos_drawdown: 0.35
  require_economic_for_promote: true
  # min_deflated_sharpe: 0.0
  # pit_strict: false

factors:
  min_non_null: 50
  max_features: 48   # cover full plat_* numeric feature set after default excludes
  n_quantiles: 5
  quantile_horizon: 5
  # Decoupled prep for factor diagnostics only (signals/backtest stay on raw features)
  preprocess:
    enabled: false
    steps: [winsorize, industry_neutral, size_neutral, zscore]
    winsorize_q: 0.01
    industry_field: features.industry
    size_field: features.total_mv
    cross_section: all   # or date
    min_group_size: 30
    suffix: __prep

ic_horizons: [1, 5, 10, 20]
